function enhancePreview(slot){if(!['weapon','body'].includes(slot))return null;const id=S.equip[slot],it=items[id],base=it?.enhanceBase||id,origin=items[base],lv=it?.enhanceLevel||0;if(!origin||origin.enabled===false||origin.enhanceBase||origin.tier||!((origin.atk||0)>0||(origin.def||0)>0))return null;const next=lv<5?'refine__'+base+'__'+(lv+1):null,n=lv+1;return {id,base,level:lv,next,target:items[next],money:[0,40,90,160,260,400][n],needs:n<=2?{quang_sat:n*2}:n<=4?{quang_sat:n*2,quang_dong:n-2}:{quang_sat:10,quang_dong:4,bich_ngoc:1}}}

function forge(){modal('Lò rèn · 37 công thức', '<p>Cường hóa tối đa +5, thành công chắc chắn; nguyên liệu và giá theo nguồn.</p>',[...FORGE.map(r=>['Rèn '+name(r.id)+' · '+r.money+' đồng · '+Object.entries(r.needs).map(([id,n])=>name(id)+' ×'+n).join(', '),()=>{if(!craft(r.id))toast('Thiếu tiền hoặc nguyên liệu');forge()}]),...['weapon','body'].map(slot=>['Cường hóa '+name(S.equip[slot])+' +'+((items[S.equip[slot]]?.enhanceLevel||0)+1),()=>{if(!enhance(slot))toast('Thiếu nguyên liệu hoặc đã tối đa');forge()}])])}
const LESSONS=[{"id":"chu_quoc_ngu","tier":1,"title":"Chữ Quốc ngữ","text":"Chữ Quốc ngữ dùng các chữ cái La-tinh để ghi tiếng Việt. Các giáo sĩ phương Tây cùng người Việt đã góp công tạo ra nó; giáo sĩ Alexandre de Rhodes in cuốn từ điển Việt – Bồ – La vào năm 1651. Tiếng Việt có sáu thanh: ngang, huyền, sắc, hỏi, ngã, nặng.","questions":[{"id":"cqn1","q":"Chữ Quốc ngữ dùng loại chữ cái nào?","a":["Chữ La-tinh","Chữ Hán","Chữ Phạn","Chữ Ả Rập"],"c":0},{"id":"cqn2","q":"Tiếng Việt có bao nhiêu thanh?","a":["Bốn","Năm","Sáu","Bảy"],"c":2},{"id":"cqn3","q":"Từ điển Việt – Bồ – La của Alexandre de Rhodes in năm nào?","a":["1651","1802","1075","1945"],"c":0}]},{"id":"tet","tier":1,"title":"Tết Nguyên Đán","text":"Tết Nguyên Đán bắt đầu vào ngày mùng Một tháng Giêng âm lịch. Ngày 23 tháng Chạp, nhà nhà cúng tiễn ông Công ông Táo về trời. Theo truyền thuyết, hoàng tử Lang Liêu thời Hùng Vương làm bánh chưng hình vuông tượng trưng cho đất, bánh giầy hình tròn tượng trưng cho trời.","questions":[{"id":"tet1","q":"Tết Nguyên Đán bắt đầu vào ngày nào?","a":["Mùng Một tháng Giêng âm lịch","Rằm tháng Tám","Mùng Năm tháng Năm","Ngày 23 tháng Chạp"],"c":0},{"id":"tet2","q":"Ông Công ông Táo về trời vào ngày nào?","a":["Rằm tháng Giêng","23 tháng Chạp","Mùng Ba Tết","Mùng 10 tháng Ba"],"c":1},{"id":"tet3","q":"Theo truyền thuyết, ai làm ra bánh chưng?","a":["Lang Liêu","Thánh Gióng","Sơn Tinh","An Dương Vương"],"c":0}]},{"id":"song_nui","tier":1,"title":"Sông núi nước Nam","text":"Đất nước Việt Nam có hình chữ S. Hai đồng bằng lớn nhất là đồng bằng sông Hồng ở phía Bắc và đồng bằng sông Cửu Long ở phía Nam. Đỉnh núi cao nhất là Phan Xi Păng, thuộc dãy Hoàng Liên Sơn. Thủ đô là Hà Nội.","questions":[{"id":"sn1","q":"Đỉnh núi cao nhất Việt Nam là đỉnh nào?","a":["Phan Xi Păng","Bà Đen","Tây Côn Lĩnh","Ngọc Linh"],"c":0},{"id":"sn2","q":"Đồng bằng lớn ở phía Nam là đồng bằng nào?","a":["Sông Hồng","Sông Cửu Long","Sông Mã","Sông Cả"],"c":1},{"id":"sn3","q":"Thủ đô của Việt Nam là thành phố nào?","a":["Huế","Đà Nẵng","Hà Nội","Hải Phòng"],"c":2}]},{"id":"vua_hung","tier":1,"title":"Vua Hùng dựng nước","text":"Theo truyền thuyết, Lạc Long Quân và Âu Cơ sinh ra một bọc trăm trứng, nở thành trăm người con — vì thế người Việt tự hào là con Rồng cháu Tiên. Các vua Hùng lập nước Văn Lang, đóng đô ở Phong Châu. Giỗ Tổ Hùng Vương là ngày mùng 10 tháng Ba âm lịch.","questions":[{"id":"vh1","q":"Nhà nước đầu tiên của người Việt theo truyền thuyết là nước nào?","a":["Văn Lang","Âu Lạc","Đại Việt","Vạn Xuân"],"c":0},{"id":"vh2","q":"Giỗ Tổ Hùng Vương là ngày nào?","a":["Mùng 10 tháng Ba âm lịch","Rằm tháng Bảy","Mùng Một tháng Giêng","Mùng 5 tháng Năm"],"c":0},{"id":"vh3","q":"Âu Cơ sinh ra bao nhiêu trứng?","a":["Mười","Năm mươi","Một trăm","Một nghìn"],"c":2}]},{"id":"ca_dao","tier":1,"title":"Ca dao, tục ngữ","text":"Ông cha ta gửi lời khuyên vào tục ngữ: \"Uống nước nhớ nguồn\" dạy lòng biết ơn; \"Có công mài sắt, có ngày nên kim\" dạy sự kiên trì; \"Ăn quả nhớ kẻ trồng cây\" nhắc ta nhớ người đi trước; \"Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao\" nói về sức mạnh đoàn kết.","questions":[{"id":"cd1","q":"Điền tiếp: \"Có công mài sắt, có ngày ...\"","a":["nên kim","nên đao","thành vàng","nên người"],"c":0},{"id":"cd2","q":"\"Uống nước nhớ nguồn\" dạy ta điều gì?","a":["Biết ơn","Tiết kiệm","Chăm tắm","Đi xa"],"c":0},{"id":"cd3","q":"\"Ba cây chụm lại nên hòn núi cao\" nói về điều gì?","a":["Đoàn kết","Trồng rừng","Leo núi","Làm nhà"],"c":0}]},{"id":"phep_tinh","tier":1,"title":"Phép tính ngoài chợ","text":"Đi chợ phải biết tính. Một con cá rô giá 6 đồng thì 3 con là 18 đồng. Mua 2 bó củi giá 3 đồng một bó và 1 đấu gạo giá 4 đồng thì hết 10 đồng. Đưa 50 đồng mua món 18 đồng thì được thối lại 32 đồng.","questions":[{"id":"pt1","q":"Cá rô 6 đồng một con. 4 con giá bao nhiêu?","a":["20 đồng","24 đồng","18 đồng","30 đồng"],"c":1},{"id":"pt2","q":"Đưa 50 đồng, mua món 18 đồng. Được thối lại bao nhiêu?","a":["22 đồng","32 đồng","38 đồng","28 đồng"],"c":1},{"id":"pt3","q":"2 bó củi (3 đồng/bó) và 1 đấu gạo (4 đồng) hết bao nhiêu?","a":["7 đồng","9 đồng","10 đồng","12 đồng"],"c":2}]},{"id":"bach_dang","tier":2,"title":"Trận Bạch Đằng","text":"Năm 938, Ngô Quyền cho cắm cọc gỗ đầu bịt sắt dưới lòng sông Bạch Đằng, nhử thuyền giặc Nam Hán vào lúc nước lên rồi đánh khi nước rút, thuyền giặc mắc cọc mà vỡ. Năm 1288, Hưng Đạo đại vương Trần Quốc Tuấn lại dùng bãi cọc trên sông Bạch Đằng đánh tan thủy quân Nguyên.","questions":[{"id":"bd1","q":"Ngô Quyền đánh tan quân Nam Hán trên sông Bạch Đằng năm nào?","a":["938","1077","1288","1789"],"c":0},{"id":"bd2","q":"Ngô Quyền lợi dụng điều gì để thuyền giặc mắc cọc?","a":["Thủy triều lên xuống","Gió mùa","Sương mù","Lũ lụt"],"c":0},{"id":"bd3","q":"Ai chỉ huy trận Bạch Đằng năm 1288?","a":["Lý Thường Kiệt","Trần Quốc Tuấn","Lê Lợi","Ngô Quyền"],"c":1}]},{"id":"nghe_nong","tier":2,"title":"Nghề nông","text":"Người Việt trồng lúa nước từ rất lâu đời. Con trâu cày ruộng nên được gọi là \"đầu cơ nghiệp\". Kinh nghiệm nhà nông dặn: \"Nhất nước, nhì phân, tam cần, tứ giống\" — muốn lúa tốt thì nước quan trọng nhất.","questions":[{"id":"nn1","q":"Con vật nào được gọi là \"đầu cơ nghiệp\" của nhà nông?","a":["Con trâu","Con gà","Con chó","Con mèo"],"c":0},{"id":"nn2","q":"Theo câu \"Nhất nước, nhì phân, tam cần, tứ giống\", điều gì quan trọng nhất?","a":["Nước","Phân","Siêng năng","Giống"],"c":0},{"id":"nn3","q":"Cây lương thực chính của người Việt là gì?","a":["Lúa nước","Lúa mì","Khoai tây","Ngô"],"c":0}]},{"id":"hai_ba_trung","tier":2,"title":"Hai Bà Trưng","text":"Năm 40, Trưng Trắc và Trưng Nhị dựng cờ khởi nghĩa ở Mê Linh, đánh đuổi quan quân nhà Hán. Trưng Trắc lên làm vua, đóng đô ở Mê Linh. Đây là cuộc khởi nghĩa lớn đầu tiên do phụ nữ lãnh đạo trong sử Việt.","questions":[{"id":"hbt1","q":"Hai Bà Trưng khởi nghĩa năm nào?","a":["Năm 40","Năm 248","Năm 938","Năm 1418"],"c":0},{"id":"hbt2","q":"Hai Bà Trưng dựng cờ khởi nghĩa ở đâu?","a":["Mê Linh","Lam Sơn","Hoa Lư","Cổ Loa"],"c":0},{"id":"hbt3","q":"Hai Bà Trưng đánh đuổi quân của nhà nào?","a":["Nhà Hán","Nhà Nguyên","Nhà Minh","Nhà Thanh"],"c":0}]},{"id":"van_mieu","tier":3,"title":"Văn Miếu – Quốc Tử Giám","text":"Năm 1070, vua Lý Thánh Tông cho dựng Văn Miếu ở Thăng Long. Năm 1076, Quốc Tử Giám được lập ở bên cạnh, được xem là trường đại học đầu tiên của nước ta. Về sau, tên các tiến sĩ được khắc trên bia đá đặt trên lưng rùa; ngày nay còn 82 tấm bia.","questions":[{"id":"vm1","q":"Văn Miếu được dựng năm nào?","a":["1070","1010","1428","1802"],"c":0},{"id":"vm2","q":"Trường đại học đầu tiên của nước ta là gì?","a":["Quốc Tử Giám","Trường Quốc Học","Trường Bưởi","Đông Kinh Nghĩa Thục"],"c":0},{"id":"vm3","q":"Bia tiến sĩ ở Văn Miếu đặt trên lưng con vật nào?","a":["Con rùa","Con rồng","Con lân","Con hạc"],"c":0}]},{"id":"thi_cu","tier":3,"title":"Thi cử ngày xưa","text":"Khoa thi đầu tiên mở năm 1075 thời Lý, Lê Văn Thịnh đỗ đầu. Thời Nguyễn, sĩ tử thi Hương ở các trường thi địa phương; ai đỗ hạng cao gọi là Cử nhân, đỗ hạng dưới gọi là Tú tài. Cử nhân được vào kinh thi Hội rồi thi Đình để lấy học vị Tiến sĩ; người đỗ đầu thi Đình (khi triều đình lấy đủ tam khôi) là Trạng nguyên.","questions":[{"id":"tc1","q":"Khoa thi đầu tiên ở nước ta mở năm nào?","a":["1075","1070","1010","1225"],"c":0},{"id":"tc2","q":"Thời Nguyễn, đỗ hạng cao kỳ thi Hương gọi là gì?","a":["Cử nhân","Tú tài","Tiến sĩ","Đồng sinh"],"c":0},{"id":"tc3","q":"Người đỗ đầu kỳ thi Đình gọi là gì?","a":["Trạng nguyên","Bảng nhãn","Thám hoa","Giải nguyên"],"c":0}]},{"id":"nam_quoc","tier":3,"title":"Nam quốc sơn hà","text":"Năm 1077, quân Tống sang xâm lược. Lý Thường Kiệt cho đắp phòng tuyến trên sông Như Nguyệt (sông Cầu). Tương truyền, giữa đêm vang lên bài thơ \"Nam quốc sơn hà Nam đế cư\" — sông núi nước Nam vua Nam ở — làm quân ta thêm vững lòng, giặc thêm khiếp sợ.","questions":[{"id":"nq1","q":"Phòng tuyến chống Tống năm 1077 đắp trên sông nào?","a":["Sông Như Nguyệt","Sông Bạch Đằng","Sông Hương","Sông Đà"],"c":0},{"id":"nq2","q":"Ai chỉ huy kháng chiến chống Tống năm 1077?","a":["Lý Thường Kiệt","Trần Hưng Đạo","Quang Trung","Lê Lợi"],"c":0},{"id":"nq3","q":"Câu \"Nam quốc sơn hà Nam đế cư\" nghĩa là gì?","a":["Sông núi nước Nam vua Nam ở","Nước Nam có nhiều núi","Vua Nam đi tuần sông núi","Phía nam có sông lớn"],"c":0}]}];
const EDU_RANKS=[{id:0,name:'Chưa đi học'},{id:1,name:'Đồng sinh',need:60,exam:{title:'Khảo hạch làng',n:5,pass:4,fee:20,tier:1}},{id:2,name:'Tú tài',need:180,exam:{title:'Thi Hương',n:6,pass:5,fee:60,tier:2}},{id:3,name:'Cử nhân',need:400,exam:{title:'Thi Hương — hạng cao',n:8,pass:7,fee:150,tier:3}},{id:4,name:'Tiến sĩ',need:800,exam:{title:'Thi Hội – thi Đình',n:10,pass:9,fee:300,tier:3}}];
const EDU_BOOKS={sach_ca_dao:{points:30,lesson:'ca_dao'},sach_dia_ly:{points:45,lesson:'song_nui'},sach_su_viet:{points:60,lesson:'bach_dang'}};
function education(){S.edu??={};let e=S.edu;e.rank??=0;e.points??=0;e.studied??={};e.lessonDay??={day:e.day||'',n:e.n||0};e.booksRead??=[];e.failAt??=0;return e}
function eduRng(seed){let s=dailyHash(seed)||1;return()=>{let e=s+=1831565813;e=Math.imul(e^e>>>15,e|1);e^=e+Math.imul(e^e>>>7,e|61);return((e^e>>>14)>>>0)/4294967296}}
function eduShuffle(a,r){let b=a.slice();for(let i=b.length-1;i>0;i--){let n=Math.floor(r()*(i+1));[b[i],b[n]]=[b[n],b[i]]}return b}
let eduSession=null;
function studyStart(){let e=education(),day=localDay(),n=e.lessonDay.day===day?e.lessonDay.n:0;if(n>=3||S.money<10)return null;S.money-=10;e.lessonDay={day,n:n+1};let pool=LESSONS.filter(l=>l.tier<=Math.min(3,Math.max(1,e.rank+1))),lesson=pool.find(l=>!e.studied[l.id])||pool.slice().sort((a,b)=>(e.studied[a.id]||0)-(e.studied[b.id]||0))[0],seed=S.seed+'-'+Date.now(),rand=eduRng(seed+'|'+lesson.id);eduSession={kind:'lesson',id:lesson.id,title:lesson.title,text:lesson.text,questions:lesson.questions.map(q=>({id:q.id,q:q.q,a:eduShuffle(q.a,rand)}))};save(false);return eduSession}
function studyFinish(id,answers){let l=LESSONS.find(l=>l.id===id);if(!l||eduSession?.kind!=='lesson'||eduSession.id!==id)return null;eduSession=null;let e=education(),correct=l.questions.filter(q=>answers[q.id]===q.a[q.c]).length,points=correct*10;e.studied[id]=(e.studied[id]||0)+1;e.points+=points;event('study');save(false);return{correct,total:l.questions.length,points}}
function readBook(id){let b=EDU_BOOKS[id],e=education();if(!b||!S.bag[id]||e.booksRead.includes(id))return false;e.booksRead.push(id);e.points+=b.points;save(false);toast('Đọc xong '+name(id)+': +'+b.points+' điểm chữ.');return true}
function examStart(rank=education().rank+1){let e=education(),r=EDU_RANKS[rank];if(!r?.exam||rank!==e.rank+1||e.points<r.need||S.money<r.exam.fee||Date.now()-e.failAt<60000)return null;S.money-=r.exam.fee;let seed=S.seed+'-'+Date.now(),rand=eduRng(seed+'|'+rank),pool=eduShuffle(LESSONS.filter(l=>l.tier<=r.exam.tier).flatMap(l=>l.questions),rand);eduSession={kind:'exam',id:seed,rank,title:r.exam.title,pass:r.exam.pass,questions:pool.slice(0,r.exam.n).map(q=>({id:q.id,q:q.q,a:eduShuffle(q.a,rand)}))};save(false);return eduSession}
function examFinish(paper,answers){if(!paper||eduSession!==paper||paper.kind!=='exam')return null;eduSession=null;let e=education(),correct=paper.questions.filter(q=>{let original=LESSONS.flatMap(l=>l.questions).find(o=>o.id===q.id);return original&&answers[q.id]===original.a[original.c]}).length,ok=correct>=paper.pass;if(ok&&paper.rank===e.rank+1)e.rank=paper.rank;else if(!ok)e.failAt=Date.now();save(false);return{ok,correct,total:paper.questions.length,pass:paper.pass,rank:paper.rank}}
function eduQuiz(session){if(!session)return;let at=0,answers={};function draw(){let q=session.questions[at];if(!q){let result=session.kind==='lesson'?studyFinish(session.id,answers):examFinish(session,answers);modal(session.kind==='lesson'?'Kết quả bài học':result.ok?'Đỗ '+EDU_RANKS[result.rank].name+'!':'Chưa đỗ — ôn thêm rồi thi lại.','<p>Đúng '+result.correct+'/'+result.total+(result.points!==undefined?' · +'+result.points+' điểm chữ':'')+'</p>');return}modal(session.title,'<p>'+esc(session.text||'')+'</p><hr><p>'+esc(q.q)+'</p>',q.a.map(a=>[a,()=>{answers[q.id]=a;at++;draw()}]))}draw()}
function school(){let e=education(),next=EDU_RANKS[e.rank+1],n=e.lessonDay.day===localDay()?e.lessonDay.n:0;listPanel('Thầy đồ · Học chữ',[{label:'Học một bài · 10 đồng · còn '+Math.max(0,3-n)+' bài hôm nay',detail:'',act:()=>{let p=studyStart();if(p)eduQuiz(p);else toast('Hết lượt hoặc chưa đủ học phí.')}},...(next?[{label:next.exam.title+' · '+next.exam.fee+' đồng',detail:'Cần '+next.need+' điểm chữ · '+next.exam.n+' câu · đúng '+next.exam.pass+' câu để đỗ.',act:()=>{let p=examStart();if(p)eduQuiz(p);else toast(Date.now()-e.failAt<60000?'Vừa trượt — nghỉ một lát rồi thi lại.':'Chưa đủ điểm chữ hoặc lệ phí.')}}]:[{label:'Đã đỗ Tiến sĩ — bậc cao nhất',detail:'Cả làng mở mày mở mặt!'}]),...Object.entries(EDU_BOOKS).map(([id,b])=>({label:'Mua '+name(id)+' — '+items[id].price+' đồng',detail:items[id].desc+(e.booksRead.includes(id)?' (đã đọc)':''),icon:id,action:'Mua',act:()=>{if(S.money>=items[id].price&&bagHasRoom(id)){S.money-=items[id].price;add(id);save(false);school()}else toast('Chưa đủ tiền hoặc túi đồ đầy.')}})),{label:'Học vấn: '+EDU_RANKS[e.rank].name+' · '+e.points+' điểm chữ',detail:'Bậc học: '+EDU_RANKS.slice(1).map(r=>r.name+' ('+r.need+' điểm)').join(' → ')}])}
function bagHasRoom(id,freed=[]){return (S.bag[id]||0)>0||Object.values(S.bag).filter(n=>n>0).length-freed.length<40}
function useItem(id){let it=items[id];if(!it?.usable||!S.bag[id])return false;if(EDU_BOOKS[id])return readBook(id);if(!it.heal&&!it.ki)return false;if((!it.heal||S.hp>=maxHP())&&(!it.ki||S.mp>=maxMP()))return false;add(id,-1);S.hp=Math.min(maxHP(),S.hp+(it.heal||0));S.mp=Math.min(maxMP(),S.mp+(it.ki||0));save(false);return true}

function houseBuy(id){const d=HOUSE.cfg.furniture[id];if(!d||(d.need||1)>S.house||(S.houseOwned[id]||0)>=99||S.money<d.price)return false;S.money-=d.price;S.houseOwned[id]=(S.houseOwned[id]||0)+1;save(false);return true}
function houseUpgrade(){const d=HOUSE.cfg.levels.find(l=>l.id===S.house+1);if(!d||S.money<d.price)return false;S.money-=d.price;S.house=d.id;S.furniture=S.furniture.map(f=>({...f,area:d.area}));save(false);return true}
let housePlacing=null;
function houseCancel(){housePlacing?.ghost?.destroy();housePlacing=null}
function houseGhost(){if(!housePlacing||!player)return null;const id=housePlacing.id,d=HOUSE.cfg.furniture[id],r=HOUSE.sprites[id],[vx,vy]=facing(),offset=10+(vx?r.w/2:vy>0?Math.max(r.solid,8)+4:4),p={id,x:HOUSE.snap(player.x+vx*offset),y:d.kind==='wall'?HOUSE.wall(S.house,r):HOUSE.snap(player.y+vy*offset+(vy<0?-2:0))};let why=HOUSE.check(S.house,S.furniture.filter(f=>f.area===S.area),p);if(!why&&d.kind==='floor'){const box=HOUSE.rect('floor',r,p);if(player.x>box.x-5&&player.x<box.x+box.w+5&&player.y>box.y-2&&player.y<box.y+box.h+6)why='Đứng lùi ra một chút.'}housePlacing.p=p;housePlacing.why=why;housePlacing.ghost.setPosition(p.x,p.y).setTint(why?16744576:10485663);return p}
function houseStart(id){if(S.area!=='nha_'+S.house)return 'Chỉ bày đồ trong nhà mình.';if((S.houseOwned[id]||0)<=S.furniture.filter(f=>f.id===id).length)return 'Không còn món này trong kho.';houseCancel();housePlacing={id,ghost:sc.add.image(0,0,'house',id).setOrigin(.5,1).setAlpha(.75).setDepth(8998)};close();houseGhost();toast('Đang bày '+HOUSE.cfg.furniture[id].name+': đi tới chỗ muốn đặt — E đặt, Esc thôi.');return ''}
function houseConfirm(){houseGhost();if(!housePlacing)return false;if(housePlacing.why){toast(housePlacing.why);return true}const id=housePlacing.id,p=housePlacing.p,err=housePlace(id,p);if(err){toast(err);return true}houseCancel();if((S.houseOwned[id]||0)>S.furniture.filter(f=>f.id===id).length)houseStart(id);return true}
function housePlace(id,position){if(S.area!=='nha_'+S.house)return 'Phải đặt trong nhà.';const d=HOUSE.cfg.furniture[id],r=HOUSE.sprites[id],placed=S.furniture.filter(f=>f.area===S.area),owned=S.houseOwned[id]||0;if(!d||!r||placed.filter(f=>f.id===id).length>=owned)return 'Không còn món này trong kho.';if(placed.length>=HOUSE.cfg.levels[S.house-1].cap)return 'Nhà đã đủ chỗ bày đồ.';const p=position||{id,x:HOUSE.snap(player.x),y:d.kind==='wall'?HOUSE.wall(S.house,r):HOUSE.snap(player.y)};const err=HOUSE.check(S.house,placed,p);if(err)return err;S.furniture.push({...p,area:S.area});put('house',id,p.x,p.y,.5,1);save(false);return ''}
function houseTake(index){if(S.area!=='nha_'+S.house||!S.furniture[index])return false;S.furniture.splice(index,1);save(false);enter(S.area,null,{x:player.x,y:player.y});return true}
function home(){const level=HOUSE.cfg.levels[S.house-1],next=HOUSE.cfg.levels[S.house],inside=S.area===level.area;modal('Nhà & nội thất','<p>'+esc(level.name)+' · '+S.furniture.length+'/'+level.cap+' chỗ bày đồ</p>',[...(next?[['Nâng cấp: '+next.name+' · '+next.price+' đồng',()=>{if(!houseUpgrade())toast('Thiếu tiền.');home()}]]:[]),...Object.entries(HOUSE.cfg.furniture).flatMap(([id,d])=>[['Mua '+d.name+' · '+d.price+' đồng',()=>{if(!houseBuy(id))toast('Thiếu tiền, cấp nhà hoặc kho đã đầy.');home()}],...(inside?[['Bày '+d.name+' · kho '+((S.houseOwned[id]||0)-S.furniture.filter(f=>f.id===id).length),()=>{let err=houseStart(id);if(err)toast(err)}]]:[])]),...(inside?S.furniture.map((f,i)=>['Cất '+HOUSE.cfg.furniture[f.id]?.name,()=>{houseTake(i);home()}]):[])]);}

function localDay(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function previousDay(day){let d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function dailyHash(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dailyEnsure(day=localDay()){S.seed??=Math.random().toString(36).slice(2,10);S.dailyTasks??={day:'',tasks:[],bonusClaimed:false,streak:0,lastFull:''};let d=S.dailyTasks;if(d.day===day)return d;if(d.lastFull!==previousDay(day)&&d.lastFull!==day)d.streak=0;let pool=DAILY_POOL.filter(t=>(!t.flag||S[t.flag])&&(!t.requires||S.qs[t.requires]?.done)),seed=dailyHash(day+'|'+S.seed)||1;const rand=()=>{let e=seed+=1831565813;e=Math.imul(e^e>>>15,e|1);e^=e+Math.imul(e^e>>>7,e|61);return ((e^e>>>14)>>>0)/4294967296};d.day=day;d.tasks=[];while(pool.length&&d.tasks.length<3){let t=pool.splice(Math.floor(rand()*pool.length),1)[0];d.tasks.push({...t,reward:{...t.reward},n:0,taken:false,done:false,claimed:false})}d.bonusClaimed=false;return d}
function dailyEvent(ev){let d=dailyEnsure();for(let t of d.tasks)if(t.taken&&!t.done&&t.on===ev){t.n=Math.min(t.count,t.n+1);t.done=t.n>=t.count}}
function dailyTake(id){let t=dailyEnsure().tasks.find(t=>t.id===id);if(!t||t.taken)return false;t.taken=true;save(false);return true}
function taskReward(r,mult=1){S.money+=Math.round((r.money||0)*mult);xp(Math.round((r.exp||0)*mult));if(r.edu){S.edu??={points:0,day:'',n:0,seen:[]};S.edu.points+=r.edu}for(let[id,n]of Object.entries(r.items||{}))add(id,n)}
function dailyClaim(id){let d=dailyEnsure(),t=d.tasks.find(t=>t.id===id);if(!t?.done||t.claimed)return false;t.claimed=true;taskReward(t.reward,1+Math.min(.5,d.streak*.1));save(false);return true}
function dailyBonus(){let d=dailyEnsure();if(d.bonusClaimed||!d.tasks.length||!d.tasks.every(t=>t.claimed))return false;d.bonusClaimed=true;d.streak=d.lastFull===previousDay(d.day)?d.streak+1:1;d.lastFull=d.day;taskReward({money:60,exp:40,items:{thuoc_nam:1}});save(false);return true}
function dailyBoard(){let d=dailyEnsure(),n=d.tasks.filter(t=>!t.taken).length,done=d.tasks.filter(t=>t.done&&!t.claimed).length;listPanel('Bảng việc làng',[{label:'Chuỗi ngày: '+d.streak+' ngày · thưởng +'+Math.round(Math.min(.5,d.streak*.1)*100)+'%',detail:'',act:null},{label:'Nhận cả '+n+' việc hôm nay',detail:'Việc đã nhận hiện trên bảng nhiệm vụ, có chỉ đường.',act:()=>{for(let t of d.tasks)dailyTake(t.id);dailyBoard()}},{label:'Trả việc ('+done+' việc xong)',detail:'Lấy thưởng các việc đã xong. Làm đủ việc trong ngày được thêm thưởng và tăng chuỗi ngày.',act:()=>{for(let t of d.tasks)dailyClaim(t.id);dailyBonus();dailyBoard()}},...d.tasks.map(t=>({label:(t.claimed?'✓ ':t.taken?'▶ ':'◦ ')+t.title+' — '+(t.claimed?'Đã trả':t.done?'Xong':t.n+'/'+t.count),detail:t.reward.money+' đồng · '+t.reward.exp+' EXP'+(t.reward.edu?' · '+t.reward.edu+' học vấn':''),action:t.taken?'Trả việc':'Nhận việc',act:()=>{if(t.taken){dailyClaim(t.id);dailyBonus()}else dailyTake(t.id);dailyBoard()}}))])}

function huntState(){return S.hunt??={active:null,tokens:0,completed:0,readyAt:0}}
function huntNear(){return S.area==='thung_lung_suong'&&Math.hypot(player.x-224,player.y-560)<56}
function huntCheck(){if(huntNear())return true;toast('Đến bảng Tuần Rừng ở Thung Lũng Sương (từ Rừng Tre, lối ở đông nam).');return false}
function huntTake(id){if(!huntCheck())return false;let h=huntState(),c=HUNTS.find(c=>c.id===id);if(!c||h.active||S.lv<c.level||Date.now()<h.readyAt)return false;S.tracked='hunt:'+id;h.active={id,progress:c.objectives.map(()=>0),reward:{money:c.money,exp:c.exp,tokens:c.tokens},cooldownMs:30000};save(false);return true}
function huntEvent(ev){let h=huntState(),a=h.active,c=HUNTS.find(c=>c.id===a?.id);if(!c||S.area!==(c.area||'thung_lung_suong'))return;c.objectives.forEach((o,i)=>{if(o.event===ev)a.progress[i]=Math.min(o.count,(a.progress[i]||0)+1)})}
function huntClaim(){if(!huntCheck())return false;let h=huntState(),a=h.active,c=HUNTS.find(c=>c.id===a?.id);if(!c||!c.objectives.every((o,i)=>a.progress[i]>=o.count)||S.money+a.reward.money>2e9||h.tokens+a.reward.tokens>999999||h.completed>=999999)return false;taskReward(a.reward);h.tokens+=a.reward.tokens;h.completed++;h.readyAt=Date.now()+30000;h.active=null;save(false);return true}
function huntExchange(id){if(!huntCheck())return false;let h=huntState(),g=HUNT_GOODS.find(g=>g.id===id);if(!g||h.tokens<g.cost||!bagHasRoom(g.item)||(S.bag[g.item]||0)+g.qty>99999)return false;h.tokens-=g.cost;add(g.item,g.qty);save(false);return true}
function huntBoard(){if(!huntCheck())return;let h=huntState(),a=h.active,c=HUNTS.find(c=>c.id===a?.id);listPanel('Hợp đồng tuần rừng',[{label:h.tokens+' tín vật · '+h.completed+' hợp đồng',detail:c?c.objectives.map((o,i)=>o.label+': '+a.progress[i]+'/'+o.count).join(' · '):'',action:'Trả hợp đồng',act:()=>{huntClaim();huntBoard()}},...(a?[{label:'Hủy hợp đồng',detail:c.name,act:()=>modal('Hủy hợp đồng?',c.name,[['Hủy hợp đồng',()=>{h.active=null;save(false);huntBoard()}]])}]:[]),...HUNTS.map(c=>({label:c.name+' · cấp '+c.level,detail:c.objectives.map(o=>o.label+' ×'+o.count).join(' · ')+' — '+c.money+' đồng · '+c.exp+' EXP · '+c.tokens+' tín vật',action:'Nhận hợp đồng',act:()=>{huntTake(c.id);huntBoard()}})),...HUNT_GOODS.map(g=>({label:g.name+' · '+g.cost+' tín vật',detail:'',action:'Đổi',act:()=>{huntExchange(g.id);huntBoard()}}))])}
