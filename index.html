'use strict';
(async()=>{const $=s=>document.querySelector(s),BASE='https://langtre.top/',KEY='lang-que-toi.v1',P=$('#panel');const data=JSON.parse(await new Response(new Blob([Uint8Array.from(atob($('#data').textContent.trim()),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).text());const areas=data['assets/pc_village/areas.json'].areas,defs=data['assets/pc_village/objects.json'].objects,items=data.config._l,npcs=data.config.SPe,quests=data.config.PXe,mobdefs=data.config.XPe;let S,sc,player,night,world=[],actors=[],enemies=[],nodes=[],doors=[],busy=false,ready=false,joy={x:0,y:0},lastSave=0,lastAttack=0,lastHit=0,dir='down',walk=false,timer=0,fish=null,job=null;const clean=s=>String(s??'').replaceAll('Làng Tre','Làng Quê Tôi'),props=o=>Object.fromEntries((o.properties||[]).map(p=>[p.name,p.value])),layer=(m,n)=>m.layers.find(l=>l.name===n),name=id=>clean(items[id]?.name||id),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),esc=s=>clean(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fresh(){return{area:'lang_tre',x:520,y:400,hp:100,mp:40,lv:1,xp:0,money:0,bag:{riu_cu:1,ao_lam:1},equip:{weapon:'riu_cu',armor:'ao_lam'},qs:{},skills:[],time:360,fishXP:0,kills:0,house:1,furniture:[],gather:{},delivery:null,day:0,daily:0}}
function toast(t){$('#toast').textContent=clean(t);$('#toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').style.display='none',4200)}
function modal(title,body,buttons=[]){busy=true;P.hidden=false;P.innerHTML='<h2>'+esc(title)+'</h2>'+body+'<div id="choices"></div>';for(const [label,fn] of buttons){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('#choices').append(b)}const b=document.createElement('button');b.textContent='Đóng · Esc';b.onclick=close;$('#choices').append(b)}function close(){P.hidden=true;busy=false;joy={x:0,y:0}}
function add(id,n=1){if(!id)return;S.bag[id]=(S.bag[id]||0)+n;if(S.bag[id]<=0)delete S.bag[id]}
function xp(n){S.xp+=n;while(S.xp>=S.lv*100){S.xp-=S.lv*100;S.lv++;S.hp=maxHP();S.mp=40+S.lv*4;toast('Lên cấp '+S.lv+'! Sinh lực và nội lực hồi đầy.')}}const maxHP=()=>90+S.lv*10;
function active(){return quests.filter(q=>!S.qs[q.id]?.done&&(!q.requires||(Array.isArray(q.requires)?q.requires:[q.requires]).every(id=>S.qs[id]?.done)))}
function step(q){return q.steps[S.qs[q.id]?.i||0]}
function event(ev){for(const q of active()){const st=step(q);if(!st||st.on!==ev)continue;const p=S.qs[q.id]||{i:0,n:0};if(st.take&&(S.bag[st.take]||0)<(st.takeCount||1)){toast('Cần '+(st.takeCount||1)+' '+name(st.take));continue}p.n++;if(p.n<(st.count||1)){S.qs[q.id]=p;continue}if(st.take)add(st.take,-(st.takeCount||1));if(st.item)add(st.item);if(st.flag)S[st.flag]=true;p.i++;p.n=0;if(p.i>=q.steps.length){p.done=true;const r=q.reward||{};S.money+=r.money||0;xp(r.exp||0);for(const [id,n]of Object.entries(r.items||{}))add(id,n);if(r.equip){add(r.equip);S.equip[items[r.equip]?.slot||'hat']=r.equip}toast('Hoàn thành '+q.title+' · '+(r.text||''))}else toast('Nhiệm vụ: '+q.steps[p.i].objective);S.qs[q.id]=p;}save(false)}
function save(notify=true){if(!S||!player)return;S.x=player.x;S.y=player.y;try{localStorage.setItem(KEY,JSON.stringify(S));if(notify)toast('Đã lưu ở thiết bị này')}catch(e){toast('Không lưu được: bộ nhớ trình duyệt không khả dụng')}}
function image(key,url){if(sc.textures.exists(key))return Promise.resolve();return new Promise(resolve=>{let im=new Image;im.onload=()=>{sc.textures.addImage(key,im);resolve()};im.onerror=()=>{console.warn('Ảnh chưa tải',url);resolve()};im.src=BASE+url})}
function atlas(key,json){if(!sc.textures.exists(key))return;let tex=sc.textures.get(key);for(let [id,v]of Object.entries(json.frames||{})){let f=v.frame;if(!tex.has(id))tex.add(id,0,f.x,f.y,f.w,f.h)}}
function sheet(key,w=64,h=64){if(!sc.textures.exists(key))return;let t=sc.textures.get(key),im=t.getSourceImage();for(let y=0;y<im.height/h;y++)for(let x=0;x<im.width/w;x++){let id=y*Math.floor(im.width/w)+x;if(!t.has(id))t.add(id,0,x*w,y*h,w,h)}}
function put(key,frame,x,y,ox=.5,oy=1){if(!sc.textures.exists(key))return null;const sp=sc.add.image(x,y,key,frame).setOrigin(ox,oy).setDepth(y);world.push(sp);return sp}

function blocked(x,y){let m=data.maps[S.area];if(x<6||y<6||x>m.width*16-6||y>m.height*16-6)return true;let l=layer(m,'collision');if(l?.data[Math.floor(y/16)*m.width+Math.floor(x/16)])return true;for(let a of actors.filter(a=>a.kind==='object'&&a.d.footprint)){let f=a.d.footprint;if(x>a.x+f.x-3&&x<a.x+f.x+f.w+3&&y>a.y+f.y-2&&y<a.y+f.y+f.h+2)return true}return false}

function talk(n){let q=active().find(q=>step(q)?.on==='talk:'+n.id),st=q&&step(q),lines=q&&n.quest?.[q.id+':'+st.id]||n.lines||['Chào cháu, hôm nay trời đẹp quá.'];let buttons=[['Chào hỏi',()=>{event('talk:'+n.id);close()}]];if(n.shop)buttons.push(['Mua bán',()=>shop(n)]);if(n.dojo||n.id==='vo_su_ly')buttons.push(['Học võ',skills]);if(n.id==='ong_chin')buttons.push(['Câu cá & nghề',()=>modal('Ngư phủ','<p>Đứng gần bờ nước, bấm F thả câu. Chờ cá cắn rồi bấm F đúng nhịp để kéo. Cá bán cho người bán hàng. Cấp nghề: '+(1+Math.floor(S.fishXP/30))+'</p>')]);if(n.school||n.id==='thay_do')buttons.push(['Học chữ',school]);if(n.house||n.id==='ong_moc')buttons.push(['Nhà & nội thất',home]);if(n.id==='chu_tam')buttons.push(['Nhận giao hàng',delivery]);if(n.id==='bac_luc'||n.id==='anh_ren')buttons.push(['Rèn nâng cấp',forge]);modal(n.name,lines.map(l=>'<p>'+esc(l)+'</p>').join(''),buttons)}
function interact(){if(busy){close();return}let a=near();if(!a){toast('Đến gần người, giếng, luống rau hoặc cổng rồi bấm E');return}if(a.kind==='npc'){if(S.delivery?.to===a.id){S.money+=S.delivery.reward;S.delivery=null;S.daily++;xp(15);toast('Giao hàng xong! +35 đồng')}talk(a.d)}else if(a.kind==='door')enter(a.p.targetArea,a.p.targetSpawn);else if(a.kind==='node')gather(a);else{event('interact:'+S.area+':'+a.id);let d=a.d;if(a.id.includes('well')){add('nuoc_gieng');toast('Múc được một gàu nước trong')}else if(/fire|pot|stove|campfire/.test(a.id))cook();else if(/house/.test(a.id)){modal(d.displayName,'<p>'+esc(d.interact||'Mái nhà thân quen bên đường làng.')+'</p>',[['Ghé nhà riêng',()=>enter('nha_'+S.house,'door_in')]])}else if(/board/.test(a.id))delivery();else modal(d.displayName,'<p>'+esc(d.interact||'Một góc bình yên của làng quê.')+'</p>')}}
function gather(a){let now=Date.now();if((S.gather[a.key]||0)>now){toast('Đã thu hoạch. Hãy quay lại sau một lát.');return}if(a.type==='beds'&&!(S.bag.thung_tuoi||S.bag.nuoc_gieng)){toast('Cần thùng tưới hoặc nước giếng để chăm rau');return}if(['rocks','copper','jade'].includes(a.type)&&!S.bag.cuoc_chim){toast('Cần cuốc chim — mua ở chợ');return}S.gather[a.key]=now+(a.type==='herbs'?60000:90000);add(a.item);if(a.type==='rocks'&&Math.random()<.35)add('da_xanh');event('zonegather:'+S.area+':'+a.item);xp(3);event((a.type==='beds'?'water:':'gather:')+a.item);if(a.type==='beds')event('water:bed');toast('Thu được '+name(a.item));save(false)}
function damage(){let w=items[S.equip.weapon]||{};return 10+S.lv*2+(w.attack||w.atk||0)+(S.upgrade||0)*3}
function attack(skill=0){if(busy||!ready||Date.now()-lastAttack<(skill?1500:450))return;if(skill&&S.mp<10){toast('Không đủ nội lực');return}lastAttack=Date.now();if(skill)S.mp-=10;const g=sc.add.circle(player.x,player.y-8,skill?64:30,0xffdc88,.25).setDepth(999);sc.tweens.add({targets:g,alpha:0,duration:230,onComplete:()=>g.destroy()});for(let e of enemies){if(e.hp<=0||dist(e,player)>(skill?80:42))continue;e.hp-=damage()*(skill?2:1);e.s?.setTint(0xffaaaa);sc.time.delayedCall(120,()=>e.s?.clearTint());if(e.hp<=0){e.respawn=Date.now()+(e.d.stats.respawn||25000);e.s?.setVisible(false);S.money+=e.d.stats.money?.[0]||2;xp(e.d.stats.exp||10);S.kills++;for(let drop of e.d.drops||[])if(Math.random()<drop.chance)add(drop.item);event('kill:'+e.id);event('zonekill:'+S.area+':'+e.id);toast('Hạ '+e.d.name+' · +'+e.d.stats.exp+' kinh nghiệm')}}}

function fishing(){if(busy)return;if(fish){if(fish.phase==='bite'&&Date.now()<fish.until){fish.reel++;if(fish.reel>=3){const fs=Object.keys(items).filter(k=>items[k].fish);const id=fs[Math.floor(Math.random()*Math.min(fs.length,10))]||'ca_ro';add(id);S.fishXP+=5;xp(5);event('fish:any');event('fish:'+id);toast('Bắt được '+name(id)+'! Nghề câu +5');fish=null;save(false)}else{fish.until=Date.now()+1400;toast('Kéo dây! Bấm F thêm '+(3-fish.reel)+' lần')}}else{fish=null;toast('Cá thoát mất. Chờ cá cắn rồi hãy kéo!')}return}if(!Object.keys(S.bag).some(k=>k.startsWith('can_cau'))){toast('Cần cần câu — gặp ông Chín ở Bến Sông');return}let m=data.maps[S.area],water=false;let grid=props(m).semanticGrid;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){let x=Math.floor(player.x/16)+dx,y=Math.floor(player.y/16)+dy;if(grid?.[y*m.width+x]==='w')water=true}if(!water&&!['ben_song','dam_sen','dam_lay'].includes(S.area)){toast('Hãy đến sát bờ nước để câu');return}fish={phase:'wait',until:Date.now()+2000+Math.random()*2000,reel:0};toast('Đã thả câu… chờ cá cắn.')}

function delivery(){if(S.delivery){let n=npcs.find(n=>n.id===S.delivery.to);modal('Giao hàng','<p>Đưa giỏ hàng tới '+esc(n?.name)+' ở '+esc(areas[n?.area]?.displayName)+'. Thưởng 35 đồng.</p>');return}let day=new Date().toDateString();if(S.deliveryDay!==day){S.deliveryDay=day;S.daily=0}if(S.daily>=3){toast('Đã xong 3 chuyến hôm nay');return}let choices=npcs.filter(n=>n.area==='lang_tre'&&n.id!=='truong_lang');let n=choices[Math.floor(Math.random()*choices.length)];S.delivery={to:n.id,reward:35};save(false);delivery()}
function home(){let frames=Object.keys(data['assets/house/house.json'].frames).filter(k=>!/wall|floor|plank|post/.test(k));modal('Nhà & nội thất', '<p>Nhà cấp '+S.house+' · Đồ đã đặt: '+S.furniture.length+'</p><p>V1: nhà có sẵn để khám phá. Nâng cấp, giá đồ và cách bố trí được đơn giản hóa. Đứng trong nhà rồi chọn đồ để đặt tại chân nhân vật.</p>',[['Về nhà',()=>enter('nha_'+S.house,'door_in')],['Nâng nhà · '+S.house*250+' đồng',()=>{if(S.house>=3){toast('Nhà đã cấp tối đa');return}if(S.money<S.house*250){toast('Chưa đủ đồng');return}S.money-=S.house*250;S.house++;save(false);home()}],...frames.slice(0,22).map(id=>['Đặt '+id.replaceAll('_',' ')+' · 20 đồng',()=>{if(!S.area.startsWith('nha_')){toast('Hãy vào nhà trước');return}if(S.money<20){toast('Chưa đủ đồng');return}S.money-=20;S.furniture.push({id,area:S.area,x:Math.round(player.x/16)*16,y:Math.round(player.y/16)*16});put('house',id,player.x,player.y);save(false);close()}])])}
function help(){modal('Làng Quê Tôi', '<p>WASD / mũi tên: đi · Shift: chạy · E: tương tác/cổng · J: đánh · F: câu · Q: thuốc · I: túi · L: nhiệm vụ · M: bản đồ · K: võ · B: nhà · 1–4: chiêu · Esc: đóng.</p><p>Đi gặp ông Ba phía tây làng để bắt đầu. Bản V1 độc lập, không tài khoản, không kết nối máy chủ game. Lưu ở trình duyệt này.</p><p>Ảnh đang mượn trực tiếp từ langtre.top; lần tải đầu vẫn cần mạng cho ảnh và Phaser. Muốn offline hoàn toàn cần lưu thư viện và ảnh về cùng game.</p>',[['Lưu ngay',()=>save()],['Nấu ăn (bếp mang theo V1)',cook],['Giao hàng',delivery],['Chơi mới',()=>modal('Chơi lại?','<p>Thay thế bản lưu của Làng Quê Tôi trên thiết bị này?</p>',[['Bắt đầu mới',()=>{S=fresh();enter(S.area,'player_start')}]])]])}
const dispatch={bag,journal,map:mapMenu,skills,home,help,interact,attack:()=>attack(),fish:fishing,heal};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>S&&ready&&dispatch[b.dataset.act]?.());
let pad=$('#pad'),nub=$('#nub');function stick(e){const r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/38,y=(e.clientY-r.top-r.height/2)/38,n=Math.max(1,Math.hypot(x,y));joy={x:x/n,y:y/n};nub.style.transform='translate('+joy.x*30+'px,'+joy.y*30+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);stick(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))stick(e)};pad.onpointerup=pad.onpointercancel=e=>{joy={x:0,y:0};nub.style.transform=''};
let keys={};addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.repeat||!S||!ready)return;let k=e.key.toLowerCase();if(k==='escape'){close();fish=null;return}if(busy)return;let f={e:interact,j:()=>attack(),f:fishing,q:heal,i:bag,l:journal,m:mapMenu,k:skills,b:home,h:help,'1':()=>cast(0),'2':()=>cast(1),'3':()=>cast(2),'4':()=>cast(3)};f[k]?.()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{keys={};joy={x:0,y:0};if(S)save(false)});
function update(t,dt){if(!ready||!S||!player)return;dt=Math.min(dt,50)/1000;timer+=dt;let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(busy){dx=0;dy=0}walk=!!(dx||dy);let n=Math.max(1,Math.hypot(dx,dy)),speed=keys.shift?112:75;if(walk){fish=null;dx=dx/n*speed*dt;dy=dy/n*speed*dt;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}let row=walk?(dir==='up'?5:dir==='down'?3:4):(dir==='up'?2:dir==='down'?0:1);player.setFrame(row*8+Math.floor(timer*(walk?9:4))%(walk?6:4));player.setFlipX(dir==='left');player.setDepth(player.y);
if(!busy){S.time=(S.time+dt*2)%1440;S.mp=Math.min(40+S.lv*4,S.mp+dt*.8);for(let e of enemies){if(e.hp<=0){if(Date.now()>e.respawn){e.hp=e.d.stats.hp;e.x=e.homeX;e.y=e.homeY;e.s?.setVisible(true)}continue}let d=dist(e,player);if(d<Math.max(e.d.stats.sense||80,90)&&d>16){let v=(e.d.stats.chaseSpeed||30)*dt;let x=e.x+(player.x-e.x)/d*v,y=e.y+(player.y-e.y)/d*v;if(!blocked(x,y)){e.x=x;e.y=y}e.s?.setPosition(e.x,e.y).setDepth(e.y).setFlipX(player.x<e.x)}if(d<22&&Date.now()-e.hit>(e.d.stats.attackCooldown||1200)){e.hit=Date.now();S.hp-=Math.max(1,(e.d.stats.damage||5)-(S.guard>Date.now()?5:0));if(S.hp<=0){S.hp=maxHP();S.money=Math.max(0,S.money-10);enter('lang_tre','player_start');toast('Được dân làng cứu về · mất tối đa 10 đồng');return}}}}
if(fish){if(fish.phase==='wait'&&Date.now()>fish.until){fish.phase='bite';fish.until=Date.now()+2500;toast('CÁ CẮN! Bấm F / Câu để kéo dây!')}else if(fish.phase==='bite'&&Date.now()>fish.until){fish=null;toast('Cá đã tuột mất…')}}let dark=S.time>1080||S.time<300?.48:S.time>1020?.2:0;night?.setAlpha(dark);$('#stats').textContent=clean(areas[S.area]?.displayName)+' · Cấp '+S.lv+' · ♥ '+Math.ceil(S.hp)+'/'+maxHP()+' · MP '+Math.floor(S.mp)+' · '+S.money+' đ · '+Math.floor(S.time/60).toString().padStart(2,'0')+':'+Math.floor(S.time%60).toString().padStart(2,'0');const q=active()[0];$('#quest').textContent=q?clean(q.title+' · '+step(q)?.objective):'Đã hoàn thành hành trình hiện có';if(t-lastSave>10000){lastSave=t;save(false)}}
const config={type:Phaser.CANVAS,parent:'game',backgroundColor:'#3f6336',pixelArt:true,roundPixels:true,scale:{mode:Phaser.Scale.RESIZE,width:innerWidth,height:innerHeight},scene:{create:async function(){sc=this;sc.game.canvas.tabIndex=0;sc.game.canvas.setAttribute('role','application');sc.game.canvas.setAttribute('aria-label','Sân làng Làng Quê Tôi');window.LQT={get state(){return S},data,enter,interact,event,save,get player(){return player},get scene(){return sc},get enemies(){return enemies},get nodes(){return nodes}};try{await Promise.all([image('ground','assets/pc_village/pc_ground_16.png'),image('objects','assets/pc_village/pc_objects.png'),image('house','assets/house/house.png'),image('player','assets/looks/player_ao_dem_v1.png')]);if(!sc.textures.exists('ground')||!sc.textures.exists('player'))throw Error('Không tải được ảnh thiết yếu');sheet('ground',16,16);sheet('player');atlas('objects',data['assets/pc_village/pc_objects.json']);atlas('house',data['assets/house/house.json']);$('#loading').style.display='none';let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}modal('🌾 Làng Quê Tôi','<p>Một chuyến trở về làng. Gặp ông Ba, giúp bà con, học võ và khám phá những miền đất mới.</p><small>Không đăng nhập · Tự động lưu tại thiết bị · Ảnh cần mạng</small>',[...(old?[['Tiếp tục',()=>{S={...fresh(),...old};enter(S.area,null,{x:S.x,y:S.y})}]]:[]),['Chơi mới',()=>{S=fresh();enter(S.area,'player_start')}]]);window.LQT.booted=true}catch(e){$('#loading').innerHTML='<h2>Chưa mở được cổng làng</h2><p>'+esc(e.message)+'</p><p>Kiểm tra mạng hoặc nguồn ảnh langtre.top.</p>';console.error(e)}},update}};new Phaser.Game(config);addEventListener('beforeunload',()=>S&&save(false));
})().catch(e=>{document.querySelector('#loading').textContent='Lỗi khởi tạo: '+e.message;console.error(e)});
</script></html>
